name: Validate examples
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tool tests
        run: node --test tools/test/*.test.mjs
      - name: Upload checks for every example
        run: node tools/validate.mjs examples/*/
      - name: Package every example
        run: node tools/pack.mjs examples/*/
