<section class="bc bc-team" id="team">
  <div class="bc-wrap">
    <span class="bc-eyebrow">{{ eyebrow }}</span>
    <h2 class="bc-h2">{{ heading }}</h2>
    <ul class="bc-people">{{#each team}}<li><span class="bc-avatar" aria-hidden="true">{{ initials }}</span><strong>{{ name }}</strong><span>{{ role }}</span></li>{{/each}}</ul>
  </div>
</section>
