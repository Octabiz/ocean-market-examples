<section class="bc bc-faq" id="faq">
  <div class="bc-wrap bc-faq-wrap">
    <span class="bc-eyebrow">{{ eyebrow }}</span>
    <h2 class="bc-h2">{{ heading }}</h2>
    <div class="bc-faq-list">{{#each questions}}<details><summary>{{ question }}</summary><p>{{ answer }}</p></details>{{/each}}</div>
  </div>
</section>
