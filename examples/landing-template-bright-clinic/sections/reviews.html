<section class="bc bc-reviews" id="reviews">
  <div class="bc-wrap">
    <span class="bc-eyebrow">{{ eyebrow }}</span>
    <h2 class="bc-h2">{{ heading }}</h2>
    <p class="bc-lead">{{ rating }}</p>
    <ul class="bc-quotes">{{#each reviews}}<li><blockquote>“{{ quote }}”</blockquote><cite>{{ author }}</cite></li>{{/each}}</ul>
  </div>
</section>
