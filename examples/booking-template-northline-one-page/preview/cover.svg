<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A printed 90-day plan with three milestones circled">
  <rect width="1200" height="675" fill="#e9dfcd"/>
  <rect x="0" y="470" width="1200" height="205" fill="#dfd2bb"/>
  <!-- the plan, slightly turned, as it would sit on a desk after the call -->
  <g transform="rotate(-4 600 340)">
    <rect x="300" y="70" width="600" height="560" rx="6" fill="#000" opacity=".08" transform="translate(10 14)"/>
    <rect x="300" y="70" width="600" height="560" rx="6" fill="#fffdf8"/>
    <text x="350" y="148" font-family="Georgia, serif" font-size="44" fill="#1b2229">Your next 90 days</text>
    <rect x="350" y="172" width="180" height="6" rx="3" fill="#9a3412"/>
    <!-- the path from now to day 90 -->
    <path d="M380 300 C 480 250, 560 360, 650 300 S 800 250, 840 300" fill="none" stroke="#1b2229" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle cx="380" cy="300" r="16" fill="#1b2229"/>
    <circle cx="650" cy="300" r="16" fill="#fffdf8" stroke="#1b2229" stroke-width="4"/>
    <circle cx="840" cy="300" r="16" fill="#fffdf8" stroke="#1b2229" stroke-width="4"/>
    <ellipse cx="650" cy="300" rx="40" ry="34" fill="none" stroke="#9a3412" stroke-width="4" transform="rotate(-12 650 300)"/>
    <text x="352" y="356" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2229">Day 1</text>
    <text x="618" y="364" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2229">Day 30</text>
    <text x="808" y="356" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1b2229">Day 90</text>
    <!-- handwritten-looking notes -->
    <g stroke="#57606a" stroke-width="5" stroke-linecap="round">
      <path d="M350 430h380"/><path d="M350 470h300"/><path d="M350 510h420"/><path d="M350 550h240"/>
    </g>
    <path d="M760 520l18 18 34-40" fill="none" stroke="#9a3412" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- a pen resting across the corner -->
  <g transform="rotate(28 980 520)">
    <rect x="860" y="508" width="250" height="22" rx="11" fill="#1b2229"/>
    <rect x="1080" y="508" width="30" height="22" rx="4" fill="#9a3412"/>
    <path d="M860 508l-26 11 26 11z" fill="#c9b99c"/>
  </g>
</svg>
